services:
    frontend:
        build:
            context: ./frontend
        ports:
            - "${FRONTEND_PORT:-3000}:3000"
        depends_on:
            - backend

    backend:
        build:
            context: ./backend
        ports:
            - "${BACKEND_PORT:-5000}:${BACKEND_PORT:-5000}"
        environment:
            PORT: ${BACKEND_PORT:-5000}
            MONGODB_URL: ${MONGODB_URL:-mongodb://mongodb:27017/doomsday_ready}
        depends_on:
            - mongodb

    mongodb:
        image: mongo:${MONGO_VERSION:-8}
        restart: always
        ports:
            - "${MONGO_PORT:-27017}:27017"
        volumes:
            - mongodb_data:/data/db

volumes:
    mongodb_data:
