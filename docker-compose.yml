services:
    frontend:
        build:
            context: ./frontend
        ports:
            - "3000:3000"
        depends_on:
            - backend

    backend:
        build:
            context: ./backend
        ports:
            - "5000:5000"
        environment:
            PORT: 5000
            MONGODB_URI: mongodb://mongodb:27017/doomsday_ready
        depends_on:
            - mongodb

    mongodb:
        image: mongo:8
        restart: always
        ports:
            - "27017:27017"
        volumes:
            - mongodb_data:/data/db

volumes:
    mongodb_data:
